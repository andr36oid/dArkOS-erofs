name: EROFS release

# Started by hand for one dArkOS release and one of its device images. Publishing
# the result is what declares that version usable as a ready-made partition.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: dArkOS release tag to convert (for example v11072026)
        required: true
      device:
        description: Device image of that release (the R36S family uses RG351MP)
        required: true
        default: RG351MP
      revision:
        description: Our revision of this conversion (raise it to publish again)
        required: true
        default: "1"
      prerelease:
        description: Publish as a pre-release (installers only take full releases)
        type: boolean
        default: true

permissions:
  contents: write

env:
  UPSTREAM: christianhaitian/dArkOS
  DISTRIBUTION: dArkOS
  UPSTREAM_TAG: ${{ inputs.tag }}
  IMAGE_PREFIX: dArkOS_${{ inputs.device }}

jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: erofs
      - name: Make room and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils p7zip-full btrfs-progs attr fdisk
          sudo modprobe erofs
          sudo modprobe btrfs
          df -h / /mnt
      - name: Download the dArkOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag }}"; version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$version-${{ inputs.device }}-erofs${{ inputs.revision }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "${{ inputs.tag }}" --repo "$UPSTREAM" --dir "$RUNNER_TEMP/dl" --pattern "dArkOS_${{ inputs.device }}_*.7z*"
          cd "$RUNNER_TEMP/dl"
          ls -la
          python3 - <<'PY' >> "$GITHUB_ENV"
          import hashlib, json, os
          assets = []
          for name in sorted(os.listdir(".")):
              h = hashlib.sha256()
              with open(name, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              assets.append({"name": name, "size": os.path.getsize(name), "sha256": h.hexdigest()})
          print("UPSTREAM_ASSETS=" + json.dumps(assets))
          PY
      - name: Unpack the disk image
        run: |
          cd "$RUNNER_TEMP/dl"
          first=$(ls | sort | head -1)
          7z l "$first" | tail -5
          mkdir -p "$RUNNER_TEMP/img"
          7z x -o"$RUNNER_TEMP/img" "$first" '*.img' -r
          rm -f ./*
          ls -la "$RUNNER_TEMP/img"
          df -h /
      - name: Convert and verify
        run: |
          image=$(find "$RUNNER_TEMP/img" -name '*.img' | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          sudo --preserve-env=UPSTREAM,UPSTREAM_TAG,UPSTREAM_ASSETS,DISTRIBUTION,IMAGE_PREFIX bash erofs/convert.sh "$image" "$RUNNER_TEMP/out" "$VERSION" "${{ inputs.revision }}"
          sudo chown -R "$USER" "$RUNNER_TEMP/out"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          [ "${{ inputs.prerelease }}" = "true" ] && flag="--prerelease"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $flag \
            --title "$DISTRIBUTION $VERSION as EROFS (revision ${{ inputs.revision }})" \
            --notes "The root filesystem of $DISTRIBUTION $VERSION, unchanged, as a compressed read-only EROFS image for andr36oid. Packed with xz; manifest.json lists files, sizes and checksums." \
            "$RUNNER_TEMP"/out/*
